# nginx reverse proxy for MyLight
# Use this if you want SSL termination or to serve on port 80/443

events {
    worker_connections 1024;
}

http {
    upstream mylight {
        server mylight:3000;
    }

    # HTTP → HTTPS redirect (uncomment when using SSL)
    # server {
    #     listen 80;
    #     server_name mylight.local;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        server_name mylight.local _;

        # Increase upload size for photo uploads
        client_max_body_size 50M;

        # Proxy everything to the Go server
        location / {
            proxy_pass http://mylight;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE: disable buffering so events stream in real time
        location /api/updates {
            proxy_pass http://mylight;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # SSL (uncomment and add your certs)
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/mylight.crt;
        # ssl_certificate_key /etc/nginx/certs/mylight.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
    }
}
