name: Releases
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum
      - run: npm ci && npm run build && npm run lint
      - run: npm run test:ui
      - run: python3 scripts/test-install.py
      - run: go test -C go-server -race ./...
      - run: go vet -C go-server ./...
      - name: Build self-contained binaries
        shell: bash
        run: |
          mkdir -p go-server/web/dist release
          cp -R dist/. go-server/web/dist/
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            platform="${target%/*}"
            architecture="${target#*/}"
            artifact="mylight-${platform}-${architecture}"
            if [ "$platform" = windows ]; then artifact="${artifact}.exe"; fi
            CGO_ENABLED=0 GOOS="$platform" GOARCH="$architecture" go build -C go-server -trimpath -ldflags='-s -w' -o "../release/$artifact" .
          done
          cp scripts/install.sh release/install.sh
          cd release
          sha256sum mylight-* install.sh > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mylight-binaries
          path: release/
          retention-days: 30
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: mylight:candidate
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mylight-binaries
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Expected vMAJOR.MINOR.PATCH[-prerelease]"; exit 1; }
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --verify-tag --title "MyLight $TAG" \
            --generate-notes --notes-file docs/RELEASE_NOTES.md "${flags[@]}"
